<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pipeline_c regime search</title>
<style>
  :root {
    --bg: #0d1014;
    --panel: #151a20;
    --panel-2: #1b222a;
    --line: #29323d;
    --ink: #d9e0e8;
    --dim: #8a97a5;
    --pass: #58a050;
    --invalid: #4a5563;
    --warn: #e2c94f;
    --accent: #19bbbe;
    --finding: #e6b422;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .note { color: var(--dim); font-size: 12px; }
  #status {
    display: flex; gap: 18px; flex-wrap: wrap;
    padding: 8px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel-2); font-variant-numeric: tabular-nums;
  }
  #status b { font-weight: 600; color: var(--dim); font-size: 11px;
              text-transform: uppercase; letter-spacing: .04em; }
  #status span { margin-left: 6px; }
  main { flex: 1; display: flex; min-height: 0; }
  #knobs {
    width: 380px; flex: none; overflow-y: auto; padding: 12px 14px 40px;
    border-right: 1px solid var(--line); background: var(--panel);
  }
  #knobs h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--accent); margin: 18px 0 6px; border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
  }
  .knob { margin-bottom: 9px; }
  .knob label { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .knob code { font-size: 12px; color: var(--ink); }
  .knob input {
    width: 128px; background: #0b0e12; color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px;
    font: 12px ui-monospace, Consolas, monospace;
  }
  .knob .meaning { color: var(--dim); font-size: 11px; margin-top: 2px; }
  #buttons { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 8px; position: sticky; top: 0;
             background: var(--panel); padding: 6px 0; z-index: 2; }
  button {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 5px 12px; cursor: pointer; font-size: 12px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  select {
    background: #0b0e12; color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 4px 6px; font-size: 12px; max-width: 240px;
  }
  #message { color: var(--warn); font-size: 12px; min-height: 16px; margin: 4px 0; }
  #viewrow { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; }
  #viewrow select { width: 150px; }
  #viewrow .meaning { color: var(--dim); font-size: 11px; }

  /* The gallery is one scrolling column. Every card is `flex: none` so no
     number of cards can squeeze one, and the view box has a floor height
     so an image that has not loaded yet keeps its room. */
  #viewer { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #filterbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
               padding: 8px 12px; border-bottom: 1px solid var(--line);
               background: var(--panel-2); }
  #filterbar .label { color: var(--dim); font-size: 11px; text-transform: uppercase;
                      letter-spacing: .04em; margin-right: 4px; }
  #filterbar .chip { cursor: pointer; font-size: 11px; padding: 2px 8px; user-select: none; }
  #filterbar .chip:hover { filter: brightness(1.3); }
  #filterbar .count { color: var(--dim); font-size: 11px; margin-left: auto;
                      font-variant-numeric: tabular-nums; }
  #gallery { flex: 1; overflow-y: auto; padding: 12px; display: flex;
             flex-direction: column; gap: 10px; }
  .card {
    flex: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 8px; cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card.pass { border-color: var(--pass); box-shadow: 0 0 0 1px var(--pass) inset; }
  .card.finding { border-color: var(--finding);
                  box-shadow: 0 0 0 2px var(--finding) inset, 0 0 14px rgba(230, 180, 34, .35); }
  .card.finding .head .left { color: var(--finding); font-weight: 600; }
  .card.invalid { opacity: .45; }
  .card.open { cursor: default; opacity: 1; }
  .card .head { display: flex; justify-content: space-between; font-size: 11px;
                color: var(--dim); margin-bottom: 6px; cursor: pointer; }
  .card .head .left { color: var(--ink); }
  .viewbox { background: #000; min-height: 160px; display: flex;
             align-items: center; justify-content: center; overflow: hidden; }
  .viewbox img { display: block; max-width: 100%; height: auto;
                 image-rendering: pixelated; }
  .viewbox .missing { color: var(--dim); font-size: 12px; padding: 20px; }
  .dials { font: 11px ui-monospace, Consolas, monospace; color: var(--dim);
           margin-top: 6px; white-space: pre-wrap; word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .chip { font-size: 10px; padding: 1px 5px; border-radius: 8px;
          border: 1px solid var(--line); color: var(--dim); }
  .chip.ok { border-color: var(--pass); color: var(--pass); }
  .chip.no { border-color: #7a3b40; color: #d07079; }
  .extra { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px;
           cursor: default; }
  .extra textarea {
    width: 100%; height: 190px; background: #0b0e12; color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px; padding: 8px;
    font: 12px ui-monospace, Consolas, monospace; margin-bottom: 10px;
  }
  .extra .sheet { margin-bottom: 14px; }
  .extra .sheet h3 { font-size: 12px; color: var(--accent); margin: 0 0 4px; }
  .extra .sheet img { display: block; max-width: 100%; height: auto;
                      background: #000; image-rendering: pixelated; }
  .extra .bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  table.terms { border-collapse: collapse; font-size: 12px; margin-bottom: 12px; }
  table.terms td, table.terms th { border: 1px solid var(--line); padding: 2px 8px;
                                   text-align: right; font-variant-numeric: tabular-nums; }
  table.terms th { color: var(--dim); font-weight: 500; }
  table.terms td.name, table.terms th.name { text-align: left; }
</style>
</head>
<body>
<header>
  <h1>pipeline_c regime search</h1>
  <span class="note" id="headnote">port 5004 &middot; the screen is measured physics; a passing cell is a candidate for the author, not an approval</span>
</header>

<div id="status">
  <div><b>run</b><span id="s-run">&mdash;</span></div>
  <div><b>stage</b><span id="s-stage">idle</span></div>
  <div><b>cells</b><span id="s-cells">0</span></div>
  <div><b>findings</b><span id="s-findings">0</span></div>
  <div><b>passers</b><span id="s-pass">0</span></div>
  <div><b>invalid</b><span id="s-invalid">0</span></div>
  <div><b>cells/min</b><span id="s-rate">0</span></div>
  <div><b>best soft</b><span id="s-best">&mdash;</span></div>
  <div><b>elapsed</b><span id="s-elapsed">0 s</span></div>
</div>

<main>
  <section id="knobs">
    <div id="buttons">
      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
      <select id="runs"><option value="">(this run)</option></select>
      <button id="reopen">Reopen run</button>
      <button id="reset">Defaults</button>
    </div>
    <div id="message"></div>
    <div id="viewrow">
      <code>view</code>
      <select id="view"></select>
      <span class="meaning">the sheet every card shows; click a card for the rest</span>
    </div>
    <div id="fields"></div>
  </section>
  <section id="viewer">
    <div id="filterbar">
      <span class="label">show cells passing</span>
      <span id="filters"></span>
      <span class="count" id="f-count"></span>
    </div>
    <section id="gallery"></section>
  </section>
</main>

<script>
"use strict";

const GROUP_TITLES = {
  run: "Run",
  screen: "Screen — what counts as a plate regime",
  space: "Space — the dial ranges sampled, and what is held fixed",
  stages: "Stages",
};
const VIEW_KEY = "pipeline_c.search.view";
const FILTER_KEY = "pipeline_c.search.filters";

let CONFIG = null;
let cells = [];
let lastIndex = -1;
let viewRun = null;
let timer = null;
let currentView = "plates";
let required = new Set();   // screen terms a card must pass to be shown
let findingCount = 0;  // cards pinned at the very top of the gallery
let passerCount = 0;   // cards pinned under the findings

const $ = (id) => document.getElementById(id);

function message(text, bad) {
  const box = $("message");
  box.textContent = text || "";
  box.style.color = bad ? "#d07079" : "var(--warn)";
}

async function getJSON(url) {
  const response = await fetch(url, { cache: "no-store" });
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || response.statusText);
  return body;
}

async function postJSON(url, payload) {
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload || {}),
  });
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || response.statusText);
  return body;
}

function buildKnobs() {
  const host = $("fields");
  host.innerHTML = "";
  for (const group of ["run", "screen", "space", "stages"]) {
    const heading = document.createElement("h2");
    heading.textContent = GROUP_TITLES[group];
    host.appendChild(heading);
    for (const knob of CONFIG.knobs.filter((k) => k.group === group)) {
      const wrap = document.createElement("div");
      wrap.className = "knob";
      const label = document.createElement("label");
      const name = document.createElement("code");
      name.textContent = knob.name;
      const input = document.createElement("input");
      input.id = "k-" + knob.group + "-" + knob.name;
      input.dataset.group = knob.group;
      input.dataset.name = knob.name;
      input.dataset.ctype = knob.ctype;
      label.appendChild(name);
      label.appendChild(input);
      const meaning = document.createElement("div");
      meaning.className = "meaning";
      meaning.textContent = knob.meaning;
      wrap.appendChild(label);
      wrap.appendChild(meaning);
      host.appendChild(wrap);
    }
  }
  fillDefaults();
}

function fillDefaults() {
  for (const knob of CONFIG.knobs) {
    const input = $("k-" + knob.group + "-" + knob.name);
    const value = CONFIG.defaults[knob.group][knob.name];
    input.value = Array.isArray(value) ? value.join(", ") : String(value);
  }
}

function readKnobs() {
  const body = { run: {}, screen: {}, space: {}, stages: {} };
  for (const knob of CONFIG.knobs) {
    const input = $("k-" + knob.group + "-" + knob.name);
    body[knob.group][knob.name] = input.value;
  }
  return body;
}

function buildViewSelect() {
  const select = $("view");
  const perCell = CONFIG.cell_sheets || [];
  const names = [];
  for (const name of [...perCell, ...(CONFIG.stage3_sheets || [])]) {
    if (!names.includes(name)) names.push(name);
  }
  if (!names.length) names.push("plates", "trajectory");
  select.innerHTML = "";
  for (const name of names) {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name + (perCell.includes(name) ? "" : "  (stage 3 only)");
    select.appendChild(option);
  }
  let remembered = null;
  try { remembered = localStorage.getItem(VIEW_KEY); } catch (err) { remembered = null; }
  currentView = names.includes(remembered) ? remembered : names[0];
  select.value = currentView;
}

function fmt(value) {
  if (value === null || value === undefined) return "—";
  if (typeof value !== "number") return String(value);
  if (Number.isInteger(value)) return String(value);
  const abs = Math.abs(value);
  if (abs !== 0 && (abs < 1e-3 || abs >= 1e5)) return value.toExponential(3);
  return value.toFixed(abs < 1 ? 4 : 3);
}

function dialText(cell) {
  return Object.entries(cell.dials)
    .map(([name, value]) => name + " = " + fmt(value))
    .join("\n");
}

function sheetURL(cell, sheet) {
  const run = viewRun ? "?run=" + encodeURIComponent(viewRun) : "";
  return "/api/cell/" + cell.id + "/" + sheet + ".png" + run;
}

function sheetImage(cell, sheet, lazy) {
  const image = document.createElement("img");
  if (lazy) image.loading = "lazy";
  image.src = sheetURL(cell, sheet);
  image.alt = sheet;
  image.dataset.view = sheet;
  // Narrow strips (the trajectory) are drawn at twice their size so they
  // read; wide sheets scale down to the column and never up.
  image.addEventListener("load", () => {
    if (image.naturalWidth && image.naturalWidth < 200) {
      image.style.height = Math.min(image.naturalHeight * 2, 640) + "px";
      image.style.width = "auto";
    }
  });
  return image;
}

function fillViewBox(card, cell) {
  const box = card.querySelector(".viewbox");
  box.innerHTML = "";
  if (cell.sheets.includes(currentView)) {
    box.appendChild(sheetImage(cell, currentView, true));
  } else {
    const note = document.createElement("div");
    note.className = "missing";
    note.textContent = "no " + currentView + " sheet for this cell (stage " + cell.stage +
      "; only stage-3 cells carry every view)";
    box.appendChild(note);
  }
}

function fillExtra(card, cell) {
  const extra = card.querySelector(".extra");
  extra.innerHTML = "";

  const bar = document.createElement("div");
  bar.className = "bar";
  const close = document.createElement("button");
  close.textContent = "Collapse";
  close.addEventListener("click", () => toggleCard(card, cell, false));
  bar.appendChild(close);
  extra.appendChild(bar);

  const dials = document.createElement("textarea");
  dials.readOnly = true;
  dials.value = dialText(cell) + "\nseeds = " + cell.seeds.join(", ");
  extra.appendChild(dials);

  const rows = ["seed", "weak_final", "weak_peak", "weak_drift", "peak_ratio",
                "plate_count", "network_share", "edge_fraction", "residual_max"];
  let html = "<table class='terms'><tr>" +
    rows.map((r) => "<th class='name'>" + r + "</th>").join("") + "<th>passed</th></tr>";
  for (const world of cell.worlds) {
    html += "<tr>" + rows.map((r) => "<td>" + fmt(world[r]) + "</td>").join("") +
      "<td>" + (world.passed ? "yes" : "no") + "</td></tr>";
  }
  html += "</table>";
  const terms = document.createElement("div");
  terms.innerHTML = html;
  extra.appendChild(terms);

  for (const sheet of cell.sheets) {
    if (sheet === currentView) continue;
    const block = document.createElement("div");
    block.className = "sheet";
    const title = document.createElement("h3");
    title.textContent = sheet;
    block.appendChild(title);
    block.appendChild(sheetImage(cell, sheet, false));
    extra.appendChild(block);
  }
}

function toggleCard(card, cell, open) {
  const want = open === undefined ? !card.classList.contains("open") : open;
  card.classList.toggle("open", want);
  const extra = card.querySelector(".extra");
  if (want) fillExtra(card, cell);
  else extra.innerHTML = "";
  extra.hidden = !want;
}

// The filter bar: one chip per screen term. Green means the term must
// pass for a card to be shown; red means the term is not consulted. With
// nothing selected every card shows. Filtering hides cards; it never
// reorders them or drops them from the page.
function buildFilters() {
  const host = $("filters");
  host.innerHTML = "";
  let remembered = [];
  try { remembered = JSON.parse(localStorage.getItem(FILTER_KEY) || "[]"); }
  catch (err) { remembered = []; }
  required = new Set(remembered.filter((name) => CONFIG.terms.includes(name)));
  for (const name of CONFIG.terms) {
    const chip = document.createElement("span");
    chip.className = "chip " + (required.has(name) ? "ok" : "no");
    chip.textContent = name;
    chip.title = "click: require this term to pass";
    chip.addEventListener("click", () => {
      if (required.has(name)) required.delete(name); else required.add(name);
      chip.className = "chip " + (required.has(name) ? "ok" : "no");
      try { localStorage.setItem(FILTER_KEY, JSON.stringify([...required])); }
      catch (err) { /* private window */ }
      applyFilters();
    });
    host.appendChild(chip);
  }
}

function cellShown(cell) {
  for (const name of required) if (!cell.terms[name]) return false;
  return true;
}

function applyFilters() {
  const byId = new Map(cells.map((c) => [c.id, c]));
  let shown = 0;
  for (const card of $("gallery").children) {
    const cell = byId.get(card.dataset.id);
    const show = !cell || cellShown(cell);
    card.hidden = !show;
    if (show) shown += 1;
  }
  $("f-count").textContent = required.size
    ? shown + " of " + cells.length + " shown"
    : cells.length + " cells";
}

function cardFor(cell) {
  const card = document.createElement("div");
  card.className = "card" + (cell.finding ? " finding" : cell.passed ? " pass" : "") +
    (cell.invalid ? " invalid" : "");
  card.dataset.id = cell.id;

  const head = document.createElement("div");
  head.className = "head";
  const left = document.createElement("span");
  left.className = "left";
  left.textContent = cell.id + " · stage " + cell.stage +
    (cell.invalid ? " · invalid" : cell.passed ? " · passed" : "") +
    (cell.finding ? " · FINDING" : "");
  const right = document.createElement("span");
  right.textContent = cell.invalid
    ? "invalid · residual " + fmt(Math.max(...cell.worlds.map((w) => w.residual_max)))
    : "soft " + fmt(cell.soft_score) + " · " + cell.pass_count + "/" + cell.worlds.length;
  head.appendChild(left);
  head.appendChild(right);
  card.appendChild(head);

  const chips = document.createElement("div");
  chips.className = "chips";
  for (const [name, ok] of Object.entries(cell.terms)) {
    const chip = document.createElement("span");
    chip.className = "chip " + (ok ? "ok" : "no");
    chip.textContent = name;
    chips.appendChild(chip);
  }
  card.appendChild(chips);

  const box = document.createElement("div");
  box.className = "viewbox";
  card.appendChild(box);
  fillViewBox(card, cell);

  const dials = document.createElement("div");
  dials.className = "dials";
  dials.textContent = dialText(cell).replace(/\n/g, "  ");
  card.appendChild(dials);

  const extra = document.createElement("div");
  extra.className = "extra";
  extra.hidden = true;
  card.appendChild(extra);

  card.addEventListener("click", (event) => {
    if (event.target.closest(".extra")) return;   // copying dials, looking at sheets
    toggleCard(card, cell);
  });
  return card;
}

// Findings pinned at the top, passers under them, then everything else,
// newest first within each group. Cells arrive in index order, so a new
// card always goes to the top of its group; the scroll position is held so
// the column does not jump under the reader.
function insertCard(cell) {
  const gallery = $("gallery");
  const card = cardFor(cell);
  card.hidden = !cellShown(cell);
  const before = gallery.scrollHeight;
  if (cell.finding) {
    gallery.insertBefore(card, gallery.firstChild);
    findingCount += 1;
  } else if (cell.passed) {
    gallery.insertBefore(card, gallery.children[findingCount] || null);
    passerCount += 1;
  } else {
    gallery.insertBefore(card, gallery.children[findingCount + passerCount] || null);
  }
  if (gallery.scrollTop > 0) gallery.scrollTop += gallery.scrollHeight - before;
}

function render() {
  const gallery = $("gallery");
  gallery.innerHTML = "";
  findingCount = 0;
  passerCount = 0;
  for (const cell of cells) insertCard(cell);
  gallery.scrollTop = 0;
  applyFilters();
}

function switchView(name) {
  currentView = name;
  try { localStorage.setItem(VIEW_KEY, name); } catch (err) { /* private window */ }
  const byId = new Map(cells.map((c) => [c.id, c]));
  for (const card of $("gallery").children) {
    const cell = byId.get(card.dataset.id);
    if (!cell) continue;
    fillViewBox(card, cell);
    if (card.classList.contains("open")) fillExtra(card, cell);
  }
}

async function poll() {
  let status;
  try {
    status = await getJSON("/api/status");
  } catch (err) {
    message("status: " + err.message, true);
    return;
  }
  const showingLive = !viewRun || (status.run_id && viewRun === status.run_id);
  $("s-run").textContent = viewRun || status.run_id || "—";
  $("s-stage").textContent = showingLive ? status.stage : "(reopened)";
  $("s-cells").textContent = showingLive ? status.cells_done : cells.length;
  $("s-findings").textContent = showingLive
    ? status.findings : cells.filter((c) => c.finding).length;
  $("s-pass").textContent = showingLive
    ? status.passers : cells.filter((c) => c.passed).length;
  $("s-invalid").textContent = showingLive
    ? status.invalid : cells.filter((c) => c.invalid).length;
  $("s-rate").textContent = showingLive ? fmt(status.cells_per_minute) : "—";
  $("s-best").textContent = showingLive ? fmt(status.best_soft_score) : "—";
  $("s-elapsed").textContent = showingLive ? fmt(status.elapsed_s) + " s" : "—";
  $("start").disabled = status.running;
  $("stop").disabled = !status.running;
  if (status.error) message("run error: " + status.error, true);
  else if (status.finding) message(status.findings + " finding" +
    (status.findings === 1 ? "" : "s") + ", latest " + status.finding +
    " — pinned at the top; candidates for the author's eyes, not approvals; the run goes on");
  else if (status.stopping && status.running) message("stopping after the cells in flight");

  if (!showingLive) return;
  try {
    const url = "/api/cells?after=" + lastIndex +
      (viewRun ? "&run=" + encodeURIComponent(viewRun) : "");
    const body = await getJSON(url);
    for (const cell of body.cells) {
      cells.push(cell);
      lastIndex = cell.index;
      insertCard(cell);
    }
    if (body.cells.length) applyFilters();
  } catch (err) {
    message("cells: " + err.message, true);
  }
}

async function loadRuns() {
  try {
    const body = await getJSON("/api/runs");
    const select = $("runs");
    const chosen = select.value;
    select.innerHTML = "<option value=''>(this run)</option>";
    for (const run of body.runs) {
      const option = document.createElement("option");
      option.value = run.run_id;
      option.textContent = run.run_id + "  (" + run.cells + " cells, " +
        run.passers + " passers)";
      select.appendChild(option);
    }
    select.value = chosen;
  } catch (err) {
    message("runs: " + err.message, true);
  }
}

async function boot() {
  CONFIG = await getJSON("/api/config");
  $("headnote").textContent = "port 5004 · " + CONFIG.note;
  buildKnobs();
  buildViewSelect();
  buildFilters();
  await loadRuns();
  await poll();
  timer = setInterval(poll, 2000);
}

$("view").addEventListener("change", (event) => switchView(event.target.value));

$("start").addEventListener("click", async () => {
  message("");
  try {
    const body = await postJSON("/api/start", readKnobs());
    cells = [];
    lastIndex = -1;
    viewRun = null;
    $("runs").value = "";
    render();
    message("started " + body.run_id);
    await loadRuns();
    await poll();
  } catch (err) {
    message(err.message, true);
  }
});

$("stop").addEventListener("click", async () => {
  try {
    await postJSON("/api/stop", {});
    message("stopping after the cells in flight");
  } catch (err) {
    message(err.message, true);
  }
});

$("reopen").addEventListener("click", async () => {
  const chosen = $("runs").value;
  viewRun = chosen || null;
  cells = [];
  lastIndex = -1;
  render();
  try {
    // keep_passed: every passed cell is kept inside the 1000-cell page.
    const url = "/api/cells?after=-1&limit=1000&keep_passed=1" +
      (viewRun ? "&run=" + encodeURIComponent(viewRun) : "");
    const body = await getJSON(url);
    cells = body.cells;
    if (cells.length) lastIndex = cells[cells.length - 1].index;
    render();
    message(viewRun ? "reopened " + viewRun : "showing the live run");
  } catch (err) {
    message(err.message, true);
  }
});

$("reset").addEventListener("click", () => { fillDefaults(); message(""); });
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  const byId = new Map(cells.map((c) => [c.id, c]));
  for (const card of $("gallery").querySelectorAll(".card.open")) {
    toggleCard(card, byId.get(card.dataset.id), false);
  }
});

boot().catch((err) => message("boot: " + err.message, true));
</script>
</body>
</html>
